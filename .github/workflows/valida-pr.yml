name: Validar PR

on:
  pull_request:
    branches:
      - desenvolvimento

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Executar Build e Testes
        run: mvn clean test
